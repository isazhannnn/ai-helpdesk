<svg width="1280" height="360" viewBox="0 0 1280 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">AI Helpdesk conversation flow</title>
  <desc id="description">A four-step flow from customer question to voiced answer and supervisor trace.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse"><stop stop-color="#0D1530"/><stop offset="1" stop-color="#171435"/></linearGradient>
    <linearGradient id="accent" x1="150" y1="75" x2="1110" y2="290" gradientUnits="userSpaceOnUse"><stop stop-color="#2F5BDE"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient>
    <filter id="glow" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="9" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1280" height="360" rx="28" fill="url(#bg)"/>
  <circle cx="116" cy="55" r="145" fill="#2556D5" fill-opacity=".13"/><circle cx="1160" cy="322" r="190" fill="#7C3AED" fill-opacity=".12"/>
  <path d="M266 180H349M586 180H669M906 180H989" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
  <path d="M340 170L350 180L340 190M660 170L670 180L660 190M980 170L990 180L980 190" stroke="#88A8FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <g><rect x="46" y="85" width="220" height="190" rx="22" fill="#141E3A" stroke="#31446F"/><circle cx="86" cy="125" r="20" fill="#2F5BDE" filter="url(#glow)"/><path d="M86 113V137M75 125H97" stroke="white" stroke-width="3" stroke-linecap="round"/><text x="76" y="172" fill="white" font-size="22" font-weight="700">1. Клиент</text><text x="76" y="205" fill="#AAB7D4" font-size="16">Говорит или пишет</text><text x="76" y="231" fill="#AAB7D4" font-size="16">своими словами</text></g>
    <g><rect x="366" y="85" width="220" height="190" rx="22" fill="#141E3A" stroke="#31446F"/><circle cx="406" cy="125" r="20" fill="#426DFF" filter="url(#glow)"/><path d="M397 125C397 119 401 115 406 115C411 115 415 119 415 125V130C415 135 411 139 406 139C401 139 397 135 397 130V125Z" stroke="white" stroke-width="2.5"/><path d="M392 128C392 136 398 142 406 142C414 142 420 136 420 128M406 142V148M400 148H412" stroke="white" stroke-width="2.5" stroke-linecap="round"/><text x="396" y="172" fill="white" font-size="22" font-weight="700">2. Понимание</text><text x="396" y="205" fill="#AAB7D4" font-size="16">Русский, қазақша</text><text x="396" y="231" fill="#AAB7D4" font-size="16">и смешанная речь</text></g>
    <g><rect x="686" y="85" width="220" height="190" rx="22" fill="#141E3A" stroke="#31446F"/><circle cx="726" cy="125" r="20" fill="#5B5EF6" filter="url(#glow)"/><path d="M717 117H735M717 125H735M717 133H728" stroke="white" stroke-width="2.5" stroke-linecap="round"/><text x="716" y="172" fill="white" font-size="22" font-weight="700">3. Решение</text><text x="716" y="205" fill="#AAB7D4" font-size="16">Подходящий путь</text><text x="716" y="231" fill="#AAB7D4" font-size="16">для обращения</text></g>
    <g><rect x="1006" y="85" width="220" height="190" rx="22" fill="#141E3A" stroke="#31446F"/><circle cx="1046" cy="125" r="20" fill="#875BF7" filter="url(#glow)"/><path d="M1037 126H1055M1046 117V135" stroke="white" stroke-width="2.5" stroke-linecap="round"/><text x="1036" y="172" fill="white" font-size="22" font-weight="700">4. Ответ</text><text x="1036" y="205" fill="#AAB7D4" font-size="16">Текст, голос</text><text x="1036" y="231" fill="#AAB7D4" font-size="16">и ясная трассировка</text></g>
  </g>
  <rect x="460" y="310" width="360" height="28" rx="14" fill="#1B2850"/><text x="640" y="330" fill="#AFC0E8" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle">Понятный путь для клиента и команды поддержки</text>
</svg>
